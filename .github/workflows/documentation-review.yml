name: Documentation review

on:
  schedule:
    # Saturdays at 18:00 UTC.
    - cron: "0 18 * * 6"
  workflow_dispatch:
    inputs:
      target_branch:
        description: Fork branch to review (scheduled runs use main)
        required: true
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: documentation-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Schedule events do not supply inputs, so they use main.
      BASE_BRANCH: ${{ inputs.target_branch || 'main' }}
      BRANCH_NAME: bot/documentation-review-${{ github.run_id }}
    steps:
      - name: Check out target fork branch
        uses: actions/checkout@v4
        with:
          repository: rajnutakki/EDGAR
          ref: ${{ inputs.target_branch || 'main' }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/v2/install | bash

      - name: Restore OpenCode credentials
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          test -n "$OPENCODE_AUTH_JSON" || { echo "Missing OPENCODE_AUTH_JSON secret" >&2; exit 1; }
          install -d -m 700 "$HOME/.local/share/opencode"
          printf '%s' "$OPENCODE_AUTH_JSON" > "$HOME/.local/share/opencode/auth.json"
          chmod 600 "$HOME/.local/share/opencode/auth.json"

      - name: Create task branch
        run: git switch --create "$BRANCH_NAME"

      - name: Review and improve documentation
        run: |
          set -o pipefail
          opencode run --agent documentation-reviewer --auto \
            "Review and improve documentation on fork/$BASE_BRANCH as instructed. Do not perform GitHub operations. Finish with a Markdown report listing every documentation file changed and why; it will be included in the pull request description." \
            | tee "$RUNNER_TEMP/documentation-report.md"

      - name: Create pull request if documentation changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Documentation files plus Python files where docstrings may be updated.
          git add -A -- README.md CONTRIBUTING.md documentation_guidelines.md docs edgar
          if git diff --cached --quiet; then
            echo "No documentation changes; no PR to create."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: improve repository documentation"
          gh auth setup-git
          git push --set-upstream origin "$BRANCH_NAME"

          REPORT_FILE="$RUNNER_TEMP/documentation-report.md"
          if [ ! -s "$REPORT_FILE" ]; then
            printf 'The agent did not produce a report. See the Actions run for details.\n' > "$REPORT_FILE"
          fi
          PR_BODY="$RUNNER_TEMP/pr-body.md"
          {
            printf '## Documentation changes\n\n'
            cat "$REPORT_FILE"
            printf '\n\nGenerated by the documentation review workflow. Please review before merging.\n'
          } > "$PR_BODY"

          gh pr create \
            --repo rajnutakki/EDGAR \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "agent: improve documentation" \
            --body-file "$PR_BODY"
