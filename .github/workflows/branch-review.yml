name: Upstream branch review

on:
  schedule:
    # Sundays at 18:00 UTC.
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      target_branch:
        description: Fork branch to focus the review on (scheduled runs use main)
        required: true
        default: main
        type: string

concurrency:
  group: upstream-branch-review
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}
    steps:
      - name: Check out fork repository
        uses: actions/checkout@v4
        with:
          repository: rajnutakki/EDGAR
          ref: ${{ inputs.target_branch || 'main' }}
          fetch-depth: 0

      - name: Configure remotes and fetch branches
        run: |
          git remote rename origin fork
          git remote add origin https://github.com/reillytilbury/EDGAR.git
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --prune fork '+refs/heads/*:refs/remotes/fork/*'

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/v2/install | bash

      - name: Restore OpenCode credentials
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          test -n "$OPENCODE_AUTH_JSON" || { echo "Missing OPENCODE_AUTH_JSON secret" >&2; exit 1; }
          install -d -m 700 "$HOME/.local/share/opencode"
          printf '%s' "$OPENCODE_AUTH_JSON" > "$HOME/.local/share/opencode/auth.json"
          chmod 600 "$HOME/.local/share/opencode/auth.json"

      - name: Generate branch review
        run: |
          set -o pipefail
          opencode run --agent branch-reviewer --auto \
            "Review origin/main and fork/main, plus fork branches with commits in the last seven days. Focus recommendations on fork/$TARGET_BRANCH. Produce the required Markdown report. Do not change files." \
            | tee "$RUNNER_TEMP/branch-review.md"

      - name: Post report to ongoing review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPOSITORY="rajnutakki/EDGAR"
          ISSUE_TITLE="Ongoing branch review"
          REPORT_FILE="$RUNNER_TEMP/branch-review.md"
          COMMENT_FILE="$RUNNER_TEMP/branch-review-comment.md"

          ISSUE_NUMBER=$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "Ongoing branch review") | .number' \
            | head -n 1)

          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_URL=$(gh issue create \
              --repo "$REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body "This is the ongoing thread for automated upstream/fork branch review reports. Each scheduled or manually triggered run adds a new comment below.")
            ISSUE_NUMBER="${ISSUE_URL##*/}"
            echo "Created ongoing review issue #$ISSUE_NUMBER"
          fi

          {
            printf '## Branch review — %s\n\n' "$(date -u +%F)"
            printf 'Focus branch: `fork/%s`\n\n' "$TARGET_BRANCH"
            printf '[Actions run #%s](%s/%s/actions/runs/%s)\n\n---\n\n' \
              "$GITHUB_RUN_NUMBER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            cat "$REPORT_FILE"
          } > "$COMMENT_FILE"

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file "$COMMENT_FILE"
          ISSUE_URL=$(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json url --jq .url)
          echo "Review report posted to $ISSUE_URL"
          echo "Review report posted to [$ISSUE_URL]($ISSUE_URL)" >> "$GITHUB_STEP_SUMMARY"
