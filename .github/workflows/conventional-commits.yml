name: Conventional Commits

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-messages:
    name: Conventional Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install commitizen
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          if os.environ["EVENT_NAME"] == "pull_request":
              revision_range = f'{os.environ["BASE_SHA"]}..{os.environ["HEAD_SHA"]}'
              sys.exit(subprocess.run(["cz", "check", "--rev-range", revision_range], check=False).returncode)

          # Push payloads include the commits added by this push. Using those
          # messages avoids an invalid git range when a force-push removes the
          # previous tip from the branch history.
          with open(os.environ["EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          failed = False
          for commit in event.get("commits", []):
              message = commit.get("message", "")
              first_line = message.splitlines()[0] if message else "(empty message)"
              print(f"Checking {commit.get('id', 'unknown')[:12]}: {first_line}")
              result = subprocess.run(["cz", "check", "--message", message], check=False)
              failed |= result.returncode != 0

          sys.exit(1 if failed else 0)
          PY

  pr-title:
    name: Conventional Commit PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
