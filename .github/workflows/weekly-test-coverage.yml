name: Weekly test coverage improvements

on:
  schedule:
    # Sundays at 09:00 UTC. GitHub may delay scheduled runs during high load.
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to analyze (scheduled runs always use main)
        required: true
        default: main
        type: string

concurrency:
  group: weekly-test-coverage
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  improve-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Schedule events have no inputs, so they fall back to main.
      BASE_BRANCH: ${{ inputs.target_branch || 'main' }}
      TEST_PATH: tests
      BRANCH_NAME: bot/weekly-test-coverage-${{ github.run_id }}

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          repository: rajnutakki/EDGAR
          ref: ${{ inputs.target_branch || 'main' }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Restore OpenCode credentials
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          test -n "$OPENCODE_AUTH_JSON" || { echo "Missing OPENCODE_AUTH_JSON secret" >&2; exit 1; }
          install -d -m 700 "$HOME/.local/share/opencode"
          printf '%s' "$OPENCODE_AUTH_JSON" > "$HOME/.local/share/opencode/auth.json"
          chmod 600 "$HOME/.local/share/opencode/auth.json"

      - name: Create task branch
        run: git switch --create "$BRANCH_NAME"

      - name: Improve tests
        run: |
          set -o pipefail
          opencode run --agent test-coverage --auto \
            "Improve tests on branch '$BASE_BRANCH' as instructed. Do not perform GitHub operations. Finish with the required Markdown report; it will be included in the pull request description." \
            | tee "$RUNNER_TEMP/test-coverage-report.md"

      - name: Create pull request if tests changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A -- "$TEST_PATH"
          if git diff --cached --quiet; then
            echo "No test changes; no PR to create."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test[auto]: improve test coverage"
          gh auth setup-git
          git push --set-upstream origin "$BRANCH_NAME"

          REPORT_FILE="$RUNNER_TEMP/test-coverage-report.md"
          if [ ! -s "$REPORT_FILE" ]; then
            printf 'The agent did not produce a report. See the Actions run for details.\n' > "$REPORT_FILE"
          fi
          PR_BODY="$RUNNER_TEMP/pr-body.md"
          {
            printf '## Automated test coverage report\n\n'
            printf 'Target branch: `%s`\n\n' "$BASE_BRANCH"
            cat "$REPORT_FILE"
            printf '\n\n---\nGenerated by the weekly OpenCode test-coverage workflow. Please review the changes and test results before merging.\n'
          } > "$PR_BODY"

          gh pr create \
            --repo rajnutakki/EDGAR \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "test[auto]: improve test coverage" \
            --body-file "$PR_BODY"
