name: opencode

on:
  issue_comment:
    types: [created] # Trigger on new comments
  pull_request_review_comment:
    types: [created] # Trigger on new PR review comments

jobs:
  opencode:
    # Only run if comment contains /oc or /opencode
    if: |
      contains(github.event.comment.body, ' /oc') ||
      contains(github.event.comment.body, ' /opencode')

    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for OpenCode authentication
      contents: read # Read repository contents
      pull-requests: read # Access PR information
      issues: read # Access issue information

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }} # Required for OpenCode authentication
        with:
          model: google/gemini-3.7-flash # The model to use