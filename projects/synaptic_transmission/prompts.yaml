model:
  base: 'You are an AI scientist. Create a parameter-efficient state-space model that minimizes the held-out score of the parent models.

    **Evaluation contract:**
    * Each sample is one experiment containing multiple stimulus protocols. For every fold, model parameters are fitted jointly to all but one protocol, then evaluated on the held-out protocol without refitting. The error averages held-out fold RMSEs.
    * One parameter set is shared across all training protocols within a fold. Protocols are reset independently to `initial_state(params)`.
    * The reported score is held-out RMSE plus a complexity penalty of 0.01 per scalar free parameter. Do not include unused parameters.
    * Release is the predicted response amplitude at a stimulus event, expressed on the same scale as the measured release data. The input is a binary stimulus indicator on a dense 0.1 ms grid; `model` is called at every step, including silent intervals. `y_prev["stim_prev"]` is the stimulus for the current integration step. `y_prev["release_prev"]` is the previous model-predicted release, not an experimental observation. Return release for the current step, which should be zero without a stimulus.
    * Only predictions at observed stimulus events contribute to the loss.
    * Unstimulated equilibration lasts 30,000 ms. These durations do not guarantee steady state.

    Below are {num_parents} parent models sorted from worst to best. Analyze their strengths and weaknesses and use the evidence to propose a new model that improves held-out performance while reducing unnecessary complexity.'

  explore: 'Use the models as inspiration, but be creative: invent plausible mechanisms that explain the data.'
  exploit: 'Use the models as templates. Identify which features improve held-out predictions, combine their strengths, and remove weaknesses and redundant parameters.'

  code_guidelines: '**Code Generation Guidelines:**

    Return code containing all necessary imports, `DT = 0.1`, `initial_state(params)`, and `model(hidden_state, y_prev, params)`. The model must implement one explicit Euler step and return `(new_hidden_state, release)`. After defining the model, set `model.INITIAL_STATE = initial_state` and `model.DEFAULT_PARAMS` to sensible scalar numeric defaults for every free parameter.

    Generated model source is executed directly with JAX. Use `jax.numpy` (`jnp`) for operations on traced values. Avoid Python control flow dependent on traced values, and Python `int()` or `float()` conversions of traced values. Preserve hidden-state keys, shapes, and dtypes across steps. Both `model` and `initial_state` must be compatible with `jax.jit` and `jax.vmap`.

    The initial-state dictionary must have exactly the same keys as the hidden-state dictionary consumed and returned by the model. The params dictionary must contain all free parameters and no initial-state values. Use reasonable initial state values based on the state scales in the parent models. Do not include unused parameters.'

  docstring_guidelines: '**Docstring Guidelines:** use a descriptive model name, briefly describe the computation, and specify the state variables and parameters.'

  image_analysis_instructions: 'If a feedback plot is provided, analyze it. The first two rows show the parent models’ state equilibration, one held-out fold per column; the first row is the worst parent and the second the best. These are fixed-duration 30,000 ms traces and may not reach steady state. How will the state variable values at the end of equilibration affect the first event in stimulus protocol? How could the initialization and evolution of state variables be improved to better match the protocol?

    The release row (one above the bottom) shows event-wise predictions for the held-out protocol (worst parent blue, best parent orange) against measurements (black). Each parent’s parameters for that fold were fitted jointly to the other protocols; the held-out protocol was not used for fitting. The bottom row shows absolute event-wise residuals. Lines joining event predictions are visual guides only, not continuous predictions during silent intervals.

    Look for systematic differences, depression during repeated stimulation, and recovery as hidden states evolve during silent intervals (assess recovery from the first event after a gap). Suggest parameter-efficient ways to improve the observed dynamics. If no plot is attached, rely on the model code and evaluation contract instead.'

  parent_program_template: 'Model: {name}

    Score: {program_losses.discover.final}
    Number of free parameters: {n_params}

    ```python
    {code.model}
    ```
    ----------------------------'

parameter_estimator:
  base: 'You are an AI scientist. Create a simple, fast parameter estimator for the latest model (shown last). Previous parent models, their estimators, initial estimates, and optimized parameter values are provided as guidance for parameter scales.

    The estimator is called once per training sample (one fold) and returns one scalar parameter dictionary shared by all protocols in that sample. It receives an unbatched NumPy data dictionary. `data["release"]` and `data["time"]` have shape `(n_protocols, max_observations)`: axis 0 indexes protocols and axis 1 indexes observation events. Shorter protocols are padded with NaN; exclude padded entries using `numpy.isfinite` masks before calculating statistics. `time` is in milliseconds from each protocol’s first event; `release` contains the measured response amplitudes in the original dataset units.

    `data["stim"]` has shape `(n_protocols, n_dense_steps)` and contains binary stimulus indicators on the 0.1 ms grid. `data["_observation_index"]` has shape `(n_protocols, max_observations)` and maps observations to dense-grid indices; `-1` marks padding. Parameters are shared across protocols in a sample. Use the observed release, event times, and stimulus information as useful. Do not perform nested optimization or call the model. Return finite scalar numeric values for every model parameter.'

  code_guidelines: '**Code Generation Guidelines:**

    Include necessary imports and define `def parameter_estimator(data) -> dict[str, float]:`. Return keys exactly matching the model free parameters and finite scalar numeric values. The estimator runs on NumPy data and need not be JAX-compatible. Return code only.'

  docstring_guidelines: '**Docstring Guidelines:** briefly describe the estimation method.'

