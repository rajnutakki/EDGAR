run:
  random_seed: 42
  generation_stages: [generate_models, generate_param_ests]

io:
  data_path: "/home/rajah/projects/synaptic_transmission/dataset/data.npz"

project_params:
  discovery_equilibration_ms: 30000.0
  validation_equilibration_ms: 24000.0

evolution:
  n_generations: 2
  n_islands: 2
  batch_size: 2
  critical_population_size: 6
  n_migrants: 1
  topology: [1, 0]

llms:
  num_parents: 2
  model_llm: gemini-3.8-flash
  param_est_llm: gemini-3.8-flash
  max_tokens: 20000

scoring:
  timeout_s: 1200
  param_penalty_weight: 0.01
  optimizer: "scipy"
  jax_backend: "cpu"
  max_workers: 4
  scipy_minimize: 
    method: "Nelder-Mead"
    options: 
      maxiter: 2000
      xatol: 0.0000000001
      fatol: 0.0001
      adaptive: True
