model:
  use_image_feedback: true
  base: 'You are an AI scientist. The {num_parents} programs below are models of V1 neural responses across trials sorted from highest to lowest loss. 
    Each trial, a drifting grating of a specific orientation is presented as a visual stimulus and neural responses measured via two-photon calcium imaging.

    Your task is to create a new model that will better capture the trial-to-trial variability of these responses, resulting in a model with lower loss.

    Things to consider:

    - Sources of trial-to-trial variability and their effects on population responses.

    - Stimulus-dependent, spontaneous, population-level and network effects.

    - How correlations can be captured by low-dimensional structures.

    Models have access to a dictionary `data` containing:

    - data["stimulus"]: The stimulus angle presented at each trial (in radians), shape (n_trials,).

    - data["response"]: Neural responses, shape (n_trials, n_cells). In the training data, the bottom-right corner of the response matrix (data["response"][n_trials//2:, n_cells//2:]) is set to NaNs. The rest of the data may be used to generate predictions for the bottom right corner (test data).

    For this dataset, n_trials = 2141, n_cells = 2110.

    In order to evaluate the model:

    1. An initial estimate of `params` is provided by a parameter estimator function.

    2. The model `params` are optimized by gradient descent to minimize the mean squared error between the model predictions and the responses of the training data.

    3. The model is evaluated on held-out test data, using the optimized parameters, and the mean squared error is reported as the loss.

    The model always generates output of shape (n_trials, n_cells), with the loss for optimization / evaluation only calculated from the corresponding train / test part.
    The trials are shuffled so that the order of the trials is arbitrary.

    Models are penalized for complexity by adding a term proportional to the number of free parameters to the loss.

    Some ideas you may want to incorporate into your model:

    {ideas-injection-point}
    '
  explore: 'Analyze the strengths and weaknesses of the models shown, using this insight to inspire new and creative model designs which outperform previous ones.
    '
  exploit: 'Use the parent models as templates to produce better models by combining strengths and removing weaknesses and redundancies.
    '
  code_guidelines: '**Code Generation Guidelines:**

    * Import any packages you use.

    * Do not include any text other than the code.

    * Model signature must be `def model(data, params):` where `data` is a dict with keys "stimulus", "response".

    * params is a dict of named arrays/scalars.

    * Ensure all free parameters are numeric, not strings or functions.

    * At the beginning of the code, clip the free parameters to a biologically plausible range.

    * Cast to `int()` when using a numeric value as an array size, slice index, or `range()` argument (e.g. `n_bins = int(np.sqrt(len(x)))`).

    * You must also provide `default_params` as a Python lambda string that takes `data` as an argument and returns a dictionary.

      To ensure shape compatibility across different splits/evaluations, ALWAYS define parameter shapes dynamically using the shapes of `data["response"]`:

      - Trial-level parameters (dimension `n_trials`): use `data["response"].shape[-2]`

      - Cell-level parameters (dimension `n_cells`): use `data["response"].shape[-1]`

      - Source cell dimension (first half of cells): use `data["response"].shape[-1] // 2`

      - Target cell dimension (second half of cells): use `data["response"].shape[-1] - data["response"].shape[-1] // 2`

      Example lambda: "lambda data: {{''multiplicative_gain'': 0.8 * np.ones(data[''response''].shape[-2]), ''coupling_factor'': -0.03 * np.ones(data[''response''].shape[-1])}}"

    * Ensure all string values in function call arguments are properly JSON-escaped.

    * Ensure your model is optimization-friendly: do not apply non-differentiable operations (like `np.round`, `np.floor`, `np.ceil`, or boolean branching/comparisons) to parameters optimized by gradient descent. Avoid in-place array updates (like `x[i] = y`) as they are incompatible with JAX.
    '
  docstring_guidelines: '**Docstring Guidelines:**

    * Use a descriptive name for this model, not a version number.

    * Briefly describe what the model computes, including an equation.

    * Specify the shapes of all free parameters in the model.

    * Explicitly specify the rank of any matrix factorizations used in the model.

    '
  image_analysis_instructions: '**Image Analysis Instructions:**

    Use the provided plots to help analyze the models shown.

    In all plots, in the top panel, the actual responses (colored dots) are shown with predictions
    (colored lines, orange for worst average fit, blue for best). 

    The bottom panels show the corresponding Squared Error, `(y_pred - y_model)**2`, between the actual responses and 
    model predictions.

    The plots are organized as follows:

    Top: Responses from specific trials, with cells sorted by their predicted response from the best model on the x-axis. The colormap of the dots indicates the difference in orientation 
    between the presented stimulus on this trial and the preferred orientation of the cell.

    Bottom: Responses from specific cells, with trials on the x-axis sorted by stimulus angle, showing the tuning curve of the cell with trial-by-trial variability. The colormap of the dots
    indicates the density of points in the plot. 

    Analyze where the models fail to capture the actual responses and identify patterns in the errors across plots. For example, does the model consistently under/over predict trials or cells with large/small responses? How could you modify the model to better capture these trial or cell-specific variations?
    Do you need to introduce additional free parameters or can you modify existing ones?

    Use this analysis to inform the design of the new model, point to specific features in the plots which illustrate the strengths and weaknesses of the previous models and explain how the weaknesses can be addressed in the new model. Include this analysis in your reasoning.
    '

  parent_program_template: '**Model: {name}**

    loss: {program_losses_discover_final}

    number of free parameters: {n_params}

    {code_model}

    '
  parent_program_vars:
  - name
  - program_losses.discover.final
  - n_params
  - code.model

  ideas:
    - Stimulus coordinate jitter in the stimulus-driven response, y_t = f(\theta_t + \delta_t).
    - Dynamically varying stimulus-driven peak widths, heights or sharpness.
    - Non-linear input modulation, y_t = f(f^{-1}(\theta_t) + ...).
    - Area-preserving tuning width transformations, y_t = a_t f(a_t \theta_t).
    - Excitation/Inhibition dynamics, for example with excitatory and inhibitory latents, y_t = W_{E,t} E_t + W_{I,t} I_t, where E_t and I_t are latents.

parameter_estimator:
  base: 'You are an AI scientist. Your task is to create a parameter estimator function to estimate the free parameters of the latest model (shown last below). Also included are previous parent models and their parameter estimators. Your parameter estimator will be used to initialize the parameters of the model before they are optimized by gradient descent, so should aim to minimize the mean-squared error between the model predictions and the responses of the data.

    The parameters should be estimated directly, using statistical principles and knowledge of what the parameters do in the model.

    Parameter estimators that take longer than 1 minute to run will be rejected, so keep it simple.
    '
  explore: null
  exploit: null
  code_guidelines: '**Code Generation Guidelines:**

    * Import any packages you use.

    * Do not include any text other than the code.

    * Return a parameter dictionary containing exactly the same keys and value shapes expected by the latest model. Ensure all array parameters are converted using `.astype(float)` before returning.

    * Function signature must be `def parameter_estimator(data):`.

    * data is a dictionary with the keys: "stimulus", "response".

    * **Handling NaNs:** In the data, the bottom-right corner of the response matrix (`data["response"][n_trials//2:, n_cells//2:]`) is set to `NaN`.

      - All other regions of the array are NaN-free. Operations restricted to these regions are safe.

      - If your estimation statistics span the bottom-right region, ALWAYS use NaN-safe numpy operations (e.g., `np.nanmean`, `np.nanstd`, `np.nanmin`, `np.nanmax`, or `np.nan_to_num(..., nan=0.0)`) to prevent `NaN` values from propagating into your parameters.

    * **Parameter Dimensions:** Ensure shapes scale dynamically with the dataset dimensions:

      - Trial-level parameters (dimension `n_trials`): use `data["response"].shape[-2]`

      - Cell-level parameters (dimension `n_cells`): use `data["response"].shape[-1]`

      - Source cell dimension (first half of cells): use `data["response"].shape[-1] // 2`

      - Target cell dimension (second half of cells): use `data["response"].shape[-1] - data["response"].shape[-1] // 2`

    * **Performance:** Use vectorized NumPy operations instead of nested loops. 

    * Your response **must** be less than {max_lines} lines. If it is longer, it will be immediately rejected.
    '
  docstring_guidelines: '**Docstring Guidelines:**

    * Briefly describe the estimation method.

    '
  image_analysis_instructions: null
  parent_program_template: |
    **Parent model: {name}**
    loss: {program_losses_discover_final}
    model:
    {model_code}
    parameter_estimator:
    {param_est_code}

    ----------
  parent_program_vars:
  - name
  - program_losses.discover.final
  - model_code
  - param_est_code
  current_program_template: |
    **New model: {name}**
    {model_code}
    -----------
  current_program_vars:
  - name
  - model_code

jax_translator_model:
  base: '
    Translate the following model function to JAX-compatible code.

    Ensure that keys of data and params dicts are preserved. 
    
    Ensure that the input and output behavior of the function is preserved.

    Include all necessary imports (jax, jax.numpy as jnp).

    Ensure compatibility with jax.jit, jax.grad, and jax.vmap.

    Do not include any text other than the code, which consists of imports and the def model(data, params): function.

    '
  explore: null
  exploit: null
  code_guidelines: 'CRITICAL JAX compatibility requirements:

    * Replace all boolean indexing with `jnp.where`.

    * Use `jnp` everywhere (no `np`).

    * **In-place updates:** JAX arrays are immutable. Translate any in-place array assignments (like `x[idx] = y`) to JAX functional update syntax: `x = x.at[idx].set(y)`.

    * Avoid Python control flow (if/for) that depends on array values.

    * Never call Python `int()` / `float()` on JAX values. Use x.astype(float) instead.

    * **Never** use string indexing like `x["..."]` or `x[":"]` for array axes.

    * Ensure all string values in function call arguments are properly JSON-escaped
    '
  docstring_guidelines: '
    Do not include a docstring.
    '
  image_analysis_instructions: null
  parent_program_template: ''
  parent_program_vars: []
  current_program_template: 'Model code:

    {code_model}

    '
  current_program_vars:
  - code.model

